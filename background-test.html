<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Gradient Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0a0a2e 0%, #2d1b69 40%, #1a0a3e 70%, #0d1b3e 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .test-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      max-width: 500px;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    
    .gradient-info {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    
    .color-stop {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .color-swatch {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      border: 1px solid white;
    }
    
    .floating-numbers {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
    }
    
    .floating-number {
      position: absolute;
      font-family: 'Fredoka', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.06);
      animation: floatAround 20s infinite linear;
      user-select: none;
    }
    
    @keyframes floatAround {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.06;
      }
      90% {
        opacity: 0.06;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="floating-numbers" aria-hidden="true">
    <span class="floating-number" style="left: 10%; animation-delay: 0s;">42</span>
    <span class="floating-number" style="left: 30%; animation-delay: 3s;">17</span>
    <span class="floating-number" style="left: 50%; animation-delay: 6s;">89</span>
    <span class="floating-number" style="left: 70%; animation-delay: 9s;">34</span>
    <span class="floating-number" style="left: 85%; animation-delay: 12s;">61</span>
  </div>
  
  <div class="test-container">
    <h1>✅ Background Gradient Test</h1>
    <p>This page demonstrates the exact gradient background from the Reference_Module</p>
    
    <div class="gradient-info">
      <strong>Gradient Specification:</strong>
      <div class="color-stop">
        <div class="color-swatch" style="background: #0a0a2e;"></div>
        <span>#0a0a2e at 0%</span>
      </div>
      <div class="color-stop">
        <div class="color-swatch" style="background: #2d1b69;"></div>
        <span>#2d1b69 at 40%</span>
      </div>
      <div class="color-stop">
        <div class="color-swatch" style="background: #1a0a3e;"></div>
        <span>#1a0a3e at 70%</span>
      </div>
      <div class="color-stop">
        <div class="color-swatch" style="background: #0d1b3e;"></div>
        <span>#0d1b3e at 100%</span>
      </div>
    </div>
    
    <p style="margin-top: 20px; font-size: 0.85rem; opacity: 0.8;">
      Floating numbers (opacity: 0.06, 20s animation) are visible in the background
    </p>
  </div>
</body>
</html>
